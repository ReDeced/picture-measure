name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Формат кода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Тесты (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets -- --nocapture

  msrv:
    name: Минимальная версия Rust
    runs-on: ubuntu-latest
    steps:
      # Ровно та версия, что указана в `rust-version`: новее не проверяем.
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib --all-features

  desktop:
    name: Файл .desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Установить desktop-file-utils
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - name: Проверить
        run: desktop-file-validate assets/picture-measure.desktop
      - name: Проверить, что иконки собираются
        run: |
          sudo apt-get install -y imagemagick
          ./scripts/make-icons.sh
      - uses: actions/upload-artifact@v4
        with:
          name: icons
          path: assets/icons
          retention-days: 7

  makefile:
    name: Makefile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Установить в отдельный префикс
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils imagemagick
          make install DESTDIR="$PWD/stage" PREFIX=/usr
      - name: Проверить раскладку установки
        run: |
          test -x stage/usr/bin/picture-measure
          test -f stage/usr/share/applications/picture-measure.desktop
          test -f stage/usr/share/icons/hicolor/scalable/apps/picture-measure.svg
          test -f stage/usr/share/icons/hicolor/128x128/apps/picture-measure.png
          test -f stage/usr/share/doc/picture-measure/LICENSE
          stage/usr/bin/picture-measure --version
      - name: Проверить откат установки
        run: |
          make uninstall DESTDIR="$PWD/stage" PREFIX=/usr
          test ! -e stage/usr/bin/picture-measure
          test ! -e stage/usr/share/applications/picture-measure.desktop

  build:
    name: Сборка (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: picture-measure-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/picture-measure*
          if-no-files-found: ignore
          retention-days: 7