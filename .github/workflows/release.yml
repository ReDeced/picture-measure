name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Тег для сборки (например v0.1.0)
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: picture-measure-linux-x86_64.tar.gz
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            asset: picture-measure-linux-musl.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: picture-measure-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: picture-measure-macos-aarch64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: picture-measure-macos-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v5

      - name: Определить версию
        id: version
        # На Windows по умолчанию PowerShell, а скрипт ниже на bash.
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Установить musl-тулчейн
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Собрать
        run: cargo build --release --target ${{ matrix.target }}

      - name: Упаковать (unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        shell: bash
        run: |
          mkdir -p dist/picture-measure
          cp target/${{ matrix.target }}/release/picture-measure dist/picture-measure/
          cp README.md LICENSE dist/picture-measure/
          cp docs/JSON_FORMAT.md docs/USER_GUIDE.md dist/picture-measure/docs/ 2>/dev/null || {
            mkdir -p dist/picture-measure/docs
            cp docs/JSON_FORMAT.md docs/USER_GUIDE.md dist/picture-measure/docs/
          }
          tar -czf "dist/${{ matrix.asset }}" -C dist picture-measure

      - name: Упаковать (windows)
        if: ${{ contains(matrix.target, 'windows') }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/picture-measure/docs | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/picture-measure.exe" dist/picture-measure/
          Copy-Item README.md, LICENSE dist/picture-measure/
          Copy-Item docs/JSON_FORMAT.md, docs/USER_GUIDE.md dist/picture-measure/docs/
          Compress-Archive -Path dist/picture-measure -DestinationPath "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 14

  checksums:
    name: Контрольные суммы
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Посчитать суммы
        shell: bash
        run: |
          cd dist
          ls -1
          sha256sum -- *.tar.gz *.zip > checksums.txt
          cat checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/checksums.txt

  publish:
    name: Опубликовать релиз
    needs: [build, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Определить версию
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
          echo "Тег: ${{ steps.version.outputs.tag }}"

      - name: Проверить вложения
        shell: bash
        run: |
          cd dist
          ls -1 *.tar.gz *.zip
          count=$(ls -1 *.tar.gz *.zip | wc -l)
          if [ "$count" -ne 5 ]; then
            echo "Ожидалось 5 сборок, а получилось $count" >&2
            exit 1
          fi

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          {
            echo "## Готовые сборки picture-measure ${TAG}"
            echo
            echo "| Файл | Платформа |"
            echo "|---|---|"
            echo "| \`picture-measure-linux-x86_64.tar.gz\` | Linux, glibc |"
            echo "| \`picture-measure-linux-musl.tar.gz\` | Linux, статическая сборка musl |"
            echo "| \`picture-measure-windows-x86_64.zip\` | Windows 64-бит |"
            echo "| \`picture-measure-macos-aarch64.tar.gz\` | macOS, Apple Silicon |"
            echo "| \`picture-measure-macos-x86_64.tar.gz\` | macOS, Intel |"
            echo
            echo "Контрольные суммы SHA-256 — в \`checksums.txt\`."
            echo
            echo "### Как пользоваться"
            echo
            echo "Из распакованного архива запустите \`picture-measure\`, либо положите"
            echo "его в \`~/.local/bin\` и добавьте эту папку в \`PATH\`. На Linux файлы"
            echo "\`picture-measure.desktop\` и иконки ставятся в \`~/.local/share\`."
            echo
            echo "### Управление"
            echo
            echo "| Действие | Как |"
            echo "|---|---|"
            echo "| Точка | одиночный клик |"
            echo "| Прямоугольник | зажать и потянуть |"
            echo "| Квадрат | \`Shift\` + протяжка |"
            echo "| Панорама | средняя или правая кнопка, либо \`Alt\` + ЛКМ |"
            echo "| Масштаб | колесо мыши |"
            echo
            echo "Полное руководство — в \`docs/USER_GUIDE.md\`."
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber
          else
            gh release create "$TAG" \
              --title "picture-measure ${TAG}" \
              --notes-file notes.md \
              dist/*.tar.gz dist/*.zip dist/checksums.txt
          fi